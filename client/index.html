<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>WebsiteAbonnementen - Professionele Website Abonnementen</title>
    <meta name="description" content="Laat uw bedrijf online groeien met een professionele website op abonnementsbasis. Inclusief hosting, onderhoud, SEO en persoonlijke begeleiding. Vanaf €99/maand." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3B9BDB" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Schema.org Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WebsiteAbonnementen",
      "url": "https://websiteabonnementen.nl",
      "logo": "https://websiteabonnementen.nl/logo.png",
      "description": "Professionele website abonnementen voor MKB-bedrijven. Inclusief hosting, onderhoud, SEO en persoonlijke begeleiding.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "NL"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@websiteabonnementen.nl",
        "availableLanguage": "Dutch"
      },
      "sameAs": [
        "https://linkedin.com/company/websiteabonnementen",
        "https://twitter.com/websiteabo",
        "https://instagram.com/websiteabonnementen"
      ]
    }
    </script>
    
    <!-- Schema.org WebSite Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WebsiteAbonnementen",
      "url": "https://websiteabonnementen.nl",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://websiteabonnementen.nl/projecten?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
